name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · types · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # A real build, every time. Dropping this from the local loop let a
      # broken production build survive two phases: a server component passing
      # a function to a client one, which only a build catches.
      - run: pnpm build

  e2e:
    name: Journey · accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # The same image scripts/visual.mjs uses locally, pinned to the
    # @playwright/test version in package.json. Local and CI have to rasterise
    # identically or the snapshots are worthless — a font hinted differently
    # moves every glyph.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PW_VISUAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project=visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # The diff images are the whole point of a failure here: they show
          # what moved, which a red tick alone does not.
          name: visual-diff
          path: test-results/
          retention-days: 7
