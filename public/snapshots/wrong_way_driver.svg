<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Vehicle facing the camera against the flow of traffic">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141a"/><stop offset="1" stop-color="#1a1f26"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23282f"/><stop offset="1" stop-color="#31373f"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <path d="M0 360 L232 132 L408 132 L640 360 Z" fill="url(#road)"/>

  <!-- carriageway edge lines -->
  <path d="M0 360 L232 132" stroke="#5d646d" stroke-width="2" fill="none"/>
  <path d="M640 360 L408 132" stroke="#5d646d" stroke-width="2" fill="none"/>
  <!-- lane dashes, two lanes -->
  <path d="M213 360 L290 132" stroke="#767d86" stroke-width="2" stroke-dasharray="16 26" fill="none"/>
  <path d="M427 360 L350 132" stroke="#767d86" stroke-width="2" stroke-dasharray="16 26" fill="none"/>

  <!-- gantry -->
  <rect x="196" y="112" width="248" height="7" fill="#2a2f36"/>
  <rect x="196" y="112" width="7" height="34" fill="#2a2f36"/>
  <rect x="437" y="112" width="7" height="34" fill="#2a2f36"/>
  <circle cx="252" cy="128" r="42" fill="url(#lamp)"/>
  <circle cx="392" cy="128" r="42" fill="url(#lamp)"/>

  <g>
  <rect x="268" y="214" width="78" height="48.36" rx="3" fill="#565d67"/>
  <rect x="278.92" y="198.4" width="56.16" height="20.28" rx="3" fill="#565d67" opacity="0.85"/>
  
       <circle cx="286" cy="266" r="17" fill="#fff3d6" opacity="0.85"/>
       <circle cx="330" cy="266" r="17" fill="#fff3d6" opacity="0.85"/>
       <circle cx="286" cy="266" r="34" fill="#fff3d6" opacity="0.16"/>
       <circle cx="330" cy="266" r="34" fill="#fff3d6" opacity="0.16"/>
     </g>

  <rect width="640" height="360" fill="#0d0f12" opacity="0.18"/>
</svg>
