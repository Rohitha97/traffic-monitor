# Round-robin over two dashboard instances.
#
# Only used by the `cluster` profile, and only to make one claim checkable: with
# Redis behind the bus, it does not matter which instance a browser lands on.
# Without a broker this proxy would show two different queues, which is the
# thing roadmap #1 exists to fix and the thing this file exists to demonstrate.

events {}

http {
  upstream dashboards {
    server dashboard:3000;
    server dashboard-b:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://dashboards;
      proxy_http_version 1.1;

      # Server-Sent Events do not survive a buffering proxy: nginx would hold
      # the stream until its buffer filled, turning a live feed into a
      # periodic one. This is the same reason the stream route sets
      # X-Accel-Buffering, and both are needed — the header only helps if
      # nginx is reading it, and a hop that terminates the connection is not.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;

      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
